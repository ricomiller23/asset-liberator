name: ingest-edgar

on:
  schedule:
    - cron: "17 11 * * 1-5" # weekdays, after the prior day's EDGAR index is published
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ingest EDGAR distress signals
        env:
          # Set a repository variable SEC_USER_AGENT, e.g. "asset-liberator ops@yourdomain.com"
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: pnpm ingest --days 90 --max-enrich 150
      - name: Commit updated candidates
        run: |
          if git diff --quiet -- data/candidates.json; then
            echo "No changes"; exit 0
          fi
          git config user.name "asset-liberator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candidates.json
          git commit -m "chore(ingest): refresh EDGAR candidates"
          git push
